name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check pipeline and revision scripts
        run: |
          python -m py_compile src/trust_bc_multicohort_benchmark.py
          for f in scripts/*.py; do python -m py_compile "$f"; done

      - name: Import smoke test (revision core)
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import seer_revision_core; print('OK')"
