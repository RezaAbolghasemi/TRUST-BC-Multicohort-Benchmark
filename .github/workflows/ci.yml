name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the pinned pipeline requirements resolve
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt

      - name: Install revision-script dependencies
        # requirements.txt (v1.0 pins) and requirements-revision.txt (v1.1 pins) are
        # separate environments and must not be installed together.
        run: pip install -r requirements-revision.txt

      - name: Compile-check pipeline and revision scripts
        run: |
          python -m py_compile src/trust_bc_multicohort_benchmark.py
          for f in scripts/*.py; do python -m py_compile "$f"; done

      - name: Import smoke test (revision core)
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import seer_revision_core; print('OK')"

      - name: Riley sample-size check (Online Resource Table S9)
        run: python scripts/riley_sample_size.py
